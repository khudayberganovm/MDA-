# Local / generic deploy. For AWS see deploy/docker-compose.aws.yml.
services:
  app:
    build: .
    env_file: .env
    environment:
      ROLE: all
      NODE_ENV: production
      DEV_AUTH: "false"
      DATABASE_URL: file:/data/orders.db
    ports: ["8080:8080"]
    volumes: ["data:/data"]
    restart: unless-stopped
volumes:
  data:
